events {
    worker_connections 1024;
}

http {
    upstream backend_pool {
        server 10.7.23.156:3001;
        server 10.7.12.181:3002;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8443 ssl;

        ssl_certificate /Users/adityashankar/CN-Private-Network-Project/certs/server.crt;
        ssl_certificate_key /Users/adityashankar/CN-Private-Network-Project/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
